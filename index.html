<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 50% 40%, #3a1647 0%, #170d25 45%, #080610 100%);
  color: white;
}

/* Background glow */
body::before {
  content: "";
  position: fixed;
  width: 350px;
  height: 350px;
  background: #ff5fa2;
  filter: blur(130px);
  opacity: .18;
  top: 25%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Main container */
.scene {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Hint */
.hint {
  position: absolute;
  bottom: 12%;
  font-size: 14px;
  letter-spacing: 2px;
  opacity: .7;
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  50% {
    opacity: .25;
  }
}

/* CARD */
.card {
  width: 300px;
  height: 190px;
  position: relative;
  cursor: pointer;
  transform: translateY(-120vh);
  animation: dropCard 1.6s cubic-bezier(.2,.9,.3,1.2) forwards;
  z-index: 10;
}

@keyframes dropCard {
  0% {
    transform: translateY(-120vh) rotate(-8deg);
  }
  75% {
    transform: translateY(25px) rotate(3deg);
  }
  100% {
    transform: translateY(0) rotate(0);
  }
}

.card-back {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ff8fc7, #c73682);
  border-radius: 14px;
  box-shadow: 0 25px 60px rgba(0,0,0,.45);
}

/* Envelope flap */
.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-top: 100px solid #ffafd4;
  transform-origin: top;
  transition: transform .9s ease;
  z-index: 4;
}

/* Envelope bottom folds */
.left-fold,
.right-fold {
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  z-index: 3;
}

.left-fold {
  left: 0;
  border-top: 95px solid transparent;
  border-right: 150px solid #d84b91;
}

.right-fold {
  right: 0;
  border-top: 95px solid transparent;
  border-left: 150px solid #d84b91;
}

/* Heart */
.heart {
  position: absolute;
  z-index: 6;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%) rotate(45deg);
  width: 35px;
  height: 35px;
  background: #fff;
  transition: .5s;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 35px;
  height: 35px;
  background: #fff;
  border-radius: 50%;
}

.heart::before {
  left: -18px;
}

.heart::after {
  top: -18px;
}

/* OPEN STATE */
.card.open .flap {
  transform: rotateX(180deg);
}

.card.open .heart {
  transform: translate(-50%, -50%) rotate(45deg) scale(.5);
  opacity: 0;
}

/* Birthday message */
.message {
  position: absolute;
  width: min(88%, 360px);
  min-height: 330px;
  padding: 35px 25px;
  text-align: center;

  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(15px);

  border-radius: 25px;
  opacity: 0;
  transform: scale(.5) translateY(30px);
  pointer-events: none;

  transition: .8s cubic-bezier(.2,.8,.2,1);
  z-index: 20;
}

.message.show {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.message h1 {
  font-size: 35px;
  margin-bottom: 15px;
  background: linear-gradient(90deg, #ffd0e7, #fff);
  -webkit-background-clip: text;
  color: transparent;
}

.message p {
  font-size: 17px;
  line-height: 1.7;
  color: #ffe9f4;
}

.cake {
  font-size: 55px;
  margin-bottom: 10px;
}

/* BALLOONS */
.balloon {
  position: absolute;
  width: 55px;
  height: 70px;
  border-radius: 50%;
  opacity: .85;
  animation: float 4s ease-in-out infinite;
}

.balloon::after {
  content: "";
  position: absolute;
  width: 1px;
  height: 100px;
  background: rgba(255,255,255,.5);
  left: 50%;
  top: 68px;
}

.b1 {
  background: #ff6fae;
  left: 7%;
  top: 20%;
}

.b2 {
  background: #8e7dff;
  right: 8%;
  top: 25%;
  animation-delay: 1s;
}

.b3 {
  background: #ffd166;
  left: 15%;
  bottom: 12%;
  animation-delay: .5s;
}

.b4 {
  background: #62e6c7;
  right: 14%;
  bottom: 15%;
  animation-delay: 1.5s;
}

@keyframes float {
  50% {
    transform: translateY(-25px) rotate(4deg);
  }
}

/* FLOWERS */
.flower {
  position: absolute;
  font-size: 45px;
  animation: flowerFloat 3s ease-in-out infinite;
  z-index: 5;
}

.f1 { left: 4%; bottom: 5%; }
.f2 { right: 4%; bottom: 6%; animation-delay: 1s; }
.f3 { left: 8%; top: 8%; animation-delay: .5s; }
.f4 { right: 8%; top: 10%; animation-delay: 1.5s; }

@keyframes flowerFloat {
  50% {
    transform: translateY(-12px) rotate(5deg);
  }
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 14px;
  top: -20px;
  z-index: 30;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

/* Mobile */
@media(max-width: 500px) {
  .card {
    width: 280px;
    height: 175px;
  }

  .flap {
    border-left-width: 140px;
    border-right-width: 140px;
  }

  .message h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="scene">

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <!-- Flowers -->
  <div class="flower f1">🌸</div>
  <div class="flower f2">🌷</div>
  <div class="flower f3">🌹</div>
  <div class="flower f4">🌼</div>

  <!-- Envelope -->
  <div class="card" id="card">

    <div class="card-back"></div>

    <div class="flap"></div>

    <div class="left-fold"></div>
    <div class="right-fold"></div>

    <div class="heart"></div>

  </div>

  <div class="hint" id="hint">
    TAP THE CARD 💌
  </div>

  <!-- Birthday message -->
  <div class="message" id="message">

    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <p>
      Wishing you a day filled with
      happiness, laughter and beautiful
      memories. ✨
      <br><br>
      May this new year of your life
      bring you everything you've wished for. 💖
    </p>

    <div style="margin-top:20px;font-size:25px;">
      🌸 🎈 ✨ 🎈 🌸
    </div>

  </div>

</div>

<script>

const card = document.getElementById("card");
const message = document.getElementById("message");
const hint = document.getElementById("hint");

card.addEventListener("click", () => {

  card.classList.add("open");

  hint.style.opacity = "0";

  setTimeout(() => {

    card.style.opacity = "0";
    card.style.transform = "scale(.5)";

    message.classList.add("show");

    createConfetti();

  }, 650);

});


function createConfetti() {

  for(let i = 0; i < 90; i++) {

    const piece = document.createElement("div");

    piece.classList.add("confetti");

    piece.style.left = Math.random() * 100 + "vw";

    piece.style.animationDuration =
      (2 + Math.random() * 3) + "s";

    piece.style.animationDelay =
      Math.random() * .8 + "s";

    piece.style.transform =
      `rotate(${Math.random() * 360}deg)`;

    piece.style.background =
      `hsl(${Math.random() * 360}, 90%, 70%)`;

    document.body.appendChild(piece);

    setTimeout(() => {
      piece.remove();
    }, 5500);
  }

}

</script>

</body>
  </html>
